<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#121214" />
<title>DVB Live by ONXY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">
  <aside class="panel">
    <header class="brand">
      <div class="brand-bar"></div>
      <h1>DVB <span>Live</span><em class="byline">by ONXY</em></h1>
    </header>

    <section id="searchSection" class="search-section">
      <button id="searchToggle" class="search-head" aria-expanded="false">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M20 20l-4.6-4.6" />
        </svg>
        <span id="searchToggleLabel">Haltestelle suchen</span>
        <span class="chev">▾</span>
      </button>
      <div id="searchBody" class="search-body collapsed">
        <div class="search">
          <input id="searchInput" type="text" placeholder="Haltestelle suchen …" autocomplete="off" />
          <ul id="resultsList" class="results"></ul>
        </div>
      </div>
    </section>

    <div id="stopHeader" class="stop-header hidden">
      <span id="stopName"></span>
      <button id="clearStop" title="Andere Haltestelle wählen">&times;</button>
    </div>

    <div class="scroll-area">
      <ul id="departuresList" class="departures"></ul>

      <section id="historySection" class="history hidden">
        <button id="historyToggle" class="history-head" aria-expanded="false">
          <span class="chev">▸</span>
          <span>Zuletzt besuchte Haltestellen</span>
          <span id="historyCount" class="history-count">0</span>
        </button>
        <ul id="historyList" class="history-list hidden"></ul>
      </section>
    </div>

    <p id="errorState" class="error-state hidden"></p>
  </aside>

  <main id="map">
    <button id="panelToggle" class="panel-toggle" title="Seitenleiste ein-/ausblenden" aria-label="Seitenleiste ein-/ausblenden" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2.5" />
        <path d="M9.5 4v16" />
        <path d="M6.2 10.2l1.8 1.8-1.8 1.8" />
      </svg>
    </button>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
